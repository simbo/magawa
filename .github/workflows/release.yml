name: Release 🏷️

on:
  repository_dispatch:
    types:
      - workflow:release
  workflow_dispatch:

run-name: >
  ${{
    format(
      '{0} Branch main {1}',
      github.workflow,
      github.event_name == 'repository_dispatch' && format('"{0}"', github.event.client_payload.sha) || ''
    )
  }}

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 🪪 Retrieve Credentials
        id: credentials
        uses: simbo-actions/actions/actions/github-app-credentials@main
        with:
          app-id: ${{ secrets.SIMBO_GITHUB_APP_ID }}
          app-private-key: ${{ secrets.SIMBO_GITHUB_APP_PRIVATE_KEY }}

      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.credentials.outputs.token }}
          ref: main

      - name: 🔎 Verify Checked Commit
        if: github.event_name == 'repository_dispatch'
        env:
          CHECKED_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "$CHECKED_SHA" ]]; then
            echo "::error title=Checked Commit Mismatch::main does not match the checked commit. Release aborted."
            exit 1
          fi

      - name: 🚚 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔄 Integrate Changesets and Sync Versions
        run: |
          set -euo pipefail

          # Reject empty release runs before changing versions.
          pnpm exec changeset status --output /tmp/release-plan.json
          if ! jq --exit-status 'any(.releases[]; .name == "magawa")' /tmp/release-plan.json; then
            echo "::error::No pending release for magawa."
            exit 1
          fi

          # integrate changesets
          pnpm exec changeset version

          # update lockfile
          pnpm install --no-frozen-lockfile

      - name: 🧾 Get Release Version
        id: release-version
        run: |
          set -euo pipefail

          # Get the created release version from package.json
          version=$(jq --exit-status --raw-output '.version | select(type == "string" and length > 0)' package.json)

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid Release Version::Expected a stable version in MAJOR.MINOR.PATCH format."
            exit 1
          fi

          # Print and output the version
          echo "version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 💾 Commit & Push Changes
        uses: simbo-actions/actions/actions/commit-and-push@main
        with:
          ref: main
          name: ${{ steps.credentials.outputs.name }}
          email: ${{ steps.credentials.outputs.email }}
          message: 'ci(release): v${{ steps.release-version.outputs.version }}'
          tags: v${{ steps.release-version.outputs.version }}
