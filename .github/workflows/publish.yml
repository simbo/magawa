name: Publish 🚛

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. "1.2.3")'
        type: string
        required: true

run-name: >
  ${{
    format(
      '{0} {1}',
      github.workflow,
      github.event_name == 'workflow_dispatch'
        && format('v{0}', github.event.inputs.version)
        || github.ref_name
    )
  }}

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Prepare Publish Params
        id: params
        uses: actions/github-script@v9
        env:
          EVENT_NAME: ${{ github.event_name || '' }}
          REF_NAME: ${{ github.ref_name || '' }}
          VERSION: ${{ github.event.inputs.version || '' }}
        with:
          script: |
            const eventName = process.env.EVENT_NAME.trim();

            let version;

            switch (eventName) {
              case 'workflow_dispatch':
                version = process.env.VERSION.trim();
                break;
              case 'push':
                const ref = process.env.REF_NAME.trim();
                version = ref.substring(1);
                break;
              default:
                throw new Error(`Unsupported event name: ${eventName}`);
            }

            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              core.setFailed('Expected a stable version in MAJOR.MINOR.PATCH format.');
              return;
            }

            const tag = `v${version}`;

            core.setOutput('version', version);
            core.setOutput('tag', tag);

      - name: 🛎️ Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ steps.params.outputs.tag }}

      - name: 🔎 Verify Release Version
        env:
          EXPECTED_VERSION: ${{ steps.params.outputs.version }}
        run: |
          set -euo pipefail
          actual=$(jq --exit-status --raw-output \
            '.version | select(type == "string" and length > 0)' package.json)

          if [[ "$actual" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Tag version does not match package.json version."
            exit 1
          fi

      - name: 🚚 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Build
        run: pnpm run build

      - name: 🧾 Get Release Info
        id: info
        env:
          VERSION: ${{ steps.params.outputs.version }}
        run: |
          set -euo pipefail

          version="$VERSION"
          changelog="CHANGELOG.md"
          releaseDate=$(TZ="Europe/Berlin" date +%Y-%m-%d\ %H:%M:%S\ %Z)
          description=""

          # Fail if the changelog file does not exist
          if [[ ! -f "$changelog" ]]; then
            echo "::error title=Missing Changelog File::Changelog file not found: $changelog"
            exit 1
          fi

          # Extract the respective version's section from the changelog and remove leading and trailing whitespace
          description=$(awk -v ver="## ${version}" '
              $0 == ver { found=1; next }
              found && /^## / { exit }
              found { print }
            ' "$changelog" | \
            awk 'BEGIN{found=0} NF{found=1} found{print}' | tac | \
            awk 'BEGIN{found=0} NF{found=1} found{print}' | tac)

          # Fail if no description is set
          if [[ -z "$description" ]]; then
            echo "::error title=Missing Changelog Section::Section for ${version} could not be found in changelog: $changelog"
            exit 1
          fi

          # Output date and description
          echo "date=${releaseDate}" >> $GITHUB_OUTPUT
          {
            echo "description<<EOF"
            echo "$description"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 📦 Create Release Package
        run: zip -r magawa.zip magawa

      - name: 🪪 Retrieve Credentials
        id: credentials
        uses: simbo-actions/actions/actions/github-app-credentials@main
        with:
          app-id: ${{ secrets.SIMBO_GITHUB_APP_ID }}
          app-private-key: ${{ secrets.SIMBO_GITHUB_APP_PRIVATE_KEY }}

      - name: 🎁 Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ steps.credentials.outputs.token }}
          tag: v${{ steps.params.outputs.version }}
          name: v${{ steps.params.outputs.version }}
          body: |
            _${{ steps.info.outputs.date }}_

            ${{ steps.info.outputs.description }}
          artifacts: magawa.zip
          makeLatest: true
          skipIfReleaseExists: true

      - name: 🚚 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ steps.credentials.outputs.token }}
          git-config-name: ${{ steps.credentials.outputs.name }}
          git-config-email: ${{ steps.credentials.outputs.email }}
          folder: magawa
          commit-message: Release v${{ steps.params.outputs.version }} from ${{ steps.checkout.outputs.commit }}
